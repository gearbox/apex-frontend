name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # github.workflow prevents a same-named workflow from another file colliding;
  # github.ref makes separate PRs independent while cancelling obsolete commits.
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm check
      - name: Assert Paraglide entry points were generated
        shell: bash
        run: |
          test -f src/paraglide/runtime.js
          test -f src/paraglide/runtime.d.ts
          test -f src/paraglide/messages.js
          test -f src/paraglide/messages.d.ts
      - run: pnpm lint
      - run: pnpm format:check

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm generate
      - run: pnpm test:unit

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm generate
      - run: pnpm build
      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-build
          path: build
          if-no-files-found: error
          retention-days: 1

  e2e-chromium:
    name: e2e-chromium
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Download production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: production-build
          path: build
      - name: Verify production build artifact
        shell: bash
        run: test -f build/index.html
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:chromium
      - name: Upload Chromium diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3

  e2e-webkit:
    name: e2e-webkit
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Download production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.0
        with:
          name: production-build
          path: build
      - name: Verify production build artifact
        shell: bash
        run: test -f build/index.html
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e:webkit
      - name: Upload WebKit diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-webkit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3

  # Keep this job name for the existing Verify / verify branch-protection check.
  verify:
    name: verify
    if: always()
    needs:
      - quality
      - unit
      - build
      - e2e-chromium
      - e2e-webkit
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require all verification jobs
        env:
          RESULTS: ${{ toJson(needs) }}
        shell: bash
        run: |
          jq --exit-status 'all(.[]; .result == "success")' <<< "$RESULTS" >/dev/null || {
            echo "A required verification lane did not succeed: $RESULTS" >&2
            exit 1
          }
